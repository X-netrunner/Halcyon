# Settings > Performance & memory > Music visualizer = Light: same six bars, half the frame rate (about half the CPU of cava + the island)
[general]
bars = 6
framerate = 15
sleep_timer = 3

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 60
