[package]
name = "hx"
version = "0.1.0"
edition = "2021"
description = "Halcyon helper multitool: island data feeds, sysmode status, IDS, dossier and the decoy daemon (replaces every Python helper)"

[dependencies]
serde_json = "1"
regex = "1"
libc = "0.2"
flate2 = "1.1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
