<!DOCTYPE html>
<html>
<head>
    <title>Cockpit System Console Login</title>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #0b0c10;
            color: #c5c6c7;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: radial-gradient(circle at center, #1f2833 0%, #0b0c10 100%);
        }
        .login-box {
            width: 400px;
            padding: 40px;
            background: rgba(31, 40, 51, 0.45);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 252, 241, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease;
        }
        .login-box:hover {
            transform: translateY(-5px);
        }
        h2 {
            color: #66fcf1;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .field {
            margin-bottom: 20px;
            text-align: left;
        }
        .field label {
            display: block;
            margin-bottom: 8px;
            color: #45f3ff;
            font-size: 14px;
        }
        .field input {
            width: 100%;
            padding: 12px;
            background: #0b0c10;
            border: 1px solid #45f3ff;
            border-radius: 6px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .field input:focus {
            border-color: #66fcf1;
            box-shadow: 0 0 8px #66fcf1;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #66fcf1;
            border: none;
            color: #0b0c10;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn:hover {
            background: #45f3ff;
            box-shadow: 0 0 15px #45f3ff;
        }
        .footer {
            margin-top: 30px;
            font-size: 11px;
            color: #666;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>System Web Console</h2>
        <form method="POST" action="/login">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Log In</button>
        </form>
        <div class="footer">
            &copy; 2026 Ubuntu Linux Server. Authorized access only.
        </div>
    </div>
</body>
</html>
