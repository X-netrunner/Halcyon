[package]
name = "halcyon-music"
version = "0.1.0"
edition = "2021"
description = "Halcyon Music GUI client (pure view; no Spotify session)"

[[bin]]
name = "halcyon-music"
path = "src/main.rs"

[dependencies]
halcyon-music-core = { version = "=0.1.0", path = "../halcyon-music-core" }
# iced with tiny-skia and wgpu renderers, image/svg support, and tokio runtime
iced = { version = "=0.13.1", features = ["tiny-skia", "wgpu", "tokio", "image", "svg", "canvas", "advanced"] }
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs"] }
serde_json = "=1.0.140"
# Cover decoding happens off the UI thread (src/art.rs); iced decodes lazily on the UI thread otherwise.
# jpeg/png/webp cover the Spotify, Deezer and Cover Art Archive CDNs.
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "webp"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
anyhow = "=1.0.97"
