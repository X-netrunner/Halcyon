[package]
name = "halcyon-music"
version = "0.1.0"
edition = "2021"
description = "Halcyon Music GUI client (pure view; no Spotify session)"

[[bin]]
name = "halcyon-music"
path = "src/main.rs"

[dependencies]
halcyon-music-core = { version = "=0.1.0", path = "../halcyon-music-core" }
# iced with the tiny-skia software renderer: no GPU/wgpu dependency, which
# keeps the daemon's machine requirements minimal and lets it run under
# wlroots/X11 without Vulkan. Part 4 evaluates wgpu for smoother scrolling.
iced = { version = "=0.13.1", features = ["tiny-skia", "tokio"] }
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "fs"] }
serde_json = "=1.0.140"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
anyhow = "=1.0.97"
