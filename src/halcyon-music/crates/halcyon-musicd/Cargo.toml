[package]
name = "halcyon-musicd"
version = "0.2.0"
edition = "2021"
description = "Halcyon Music daemon: owns playback, session, cache, play log"

[[bin]]
name = "halcyon-musicd"
path = "src/main.rs"

[dependencies]
halcyon-music-core = { version = "=0.2.0", path = "../halcyon-music-core" }
tokio = { version = "=1.44.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "fs", "signal", "process"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = { version = "=1.0.140", features = ["float_roundtrip"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
tracing-appender = "=0.2.3"
anyhow = "=1.0.97"
thiserror = "=2.0.12"
libc = "=0.2.173"
# Part 2 pinned dependencies:
# - rusqlite: bundled SQLite avoids host libsqlite3 version discrepancies
rusqlite = { version = "=0.32.1", features = ["bundled"] }
# - reqwest: thin rustls client avoiding OpenSSL linkage
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
# - url: standard URL parser with serde support
url = { version = "=2.5.4", features = ["serde"] }
# - sha2 & base64: PKCE S256 challenge generation and URL image hashing
sha2 = "=0.10.8"
base64 = "=0.22.1"
# - rand: cryptographic entropy for PKCE verifiers and retry jitter
rand = "=0.8.8"
# - keyring: FreeDesktop Secret Service credential store with pure-Rust crypto
keyring = { version = "=3.6.2", features = ["sync-secret-service", "crypto-rust"] }
# Part 3 pinned dependencies:
# - zbus: D-Bus MPRIS 2 MediaPlayer2 server
zbus = "=4.4.0"
# - librespot: Spotify playback and audio pipeline with Rodio output and rustls
librespot-core = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-playback = { version = "=0.8.0", default-features = false, features = ["rodio-backend", "rustls-tls-webpki-roots"] }
# Rework Part 2: librespot's own OAuth client (token refresh now, browser sign-in in Part 3).
# Same version and the same TLS backend as librespot-core, which already depends on it.
librespot-metadata = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }
librespot-protocol = { version = "=0.8.0", default-features = false }
protobuf = "3.7"
librespot-oauth = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"] }

# Part 2 (Spotify Connect), optional: only built with `--features connect`.
# Same version and TLS backend as the other librespot crates.
librespot-connect = { version = "=0.8.0", default-features = false, features = ["rustls-tls-webpki-roots"], optional = true }

# Part 7 (built-in model), optional: llama.cpp is compiled from source, which needs cmake and a C++
# compiler, so it is behind a feature until that is proven on every supported distro.
# default-features = false: no OpenMP (libgomp) and no Android linking.
llama-cpp-2 = { version = "=0.1.161", default-features = false, optional = true }

[features]
default = []
# Run a small language model inside the daemon (`halcyon-musicd` without Ollama).
local-llm = ["dep:llama-cpp-2"]
# Registers Halcyon as a Spotify Connect device (spike: `halcyon-musicd --connect-spike`).
connect = ["dep:librespot-connect"]

[dev-dependencies]
# used by the corrupt-state / socket integration tests only
tempfile = "=3.19.1"
# start_paused / advance for the supervisor backoff tests
tokio = { version = "=1.44.2", features = ["test-util"] }
