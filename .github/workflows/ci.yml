name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [attacker-dossier, birthday-sync, hal, hx, log-analyst, power-manager, recon-deceiver, safety-check, setStaticMac, touchpad-gestures]
    steps:
      - uses: actions/checkout@v4
      - name: libraries some crates need (evdev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release --manifest-path src/${{ matrix.crate }}/Cargo.toml
      - name: test
        run: cargo test --manifest-path src/${{ matrix.crate }}/Cargo.toml
      - name: clippy (warnings reported, not blocking yet)
        continue-on-error: true
        run: cargo clippy --manifest-path src/${{ matrix.crate }}/Cargo.toml -- -W clippy::unwrap_used

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check every shell script
        run: |
          fail=0
          for f in $(git ls-files '*.sh') install.sh update.sh get.sh sysmode/sysmode scripts/halcyon-tune; do
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: shellcheck (errors only, so old scripts do not block a push)
        run: sudo apt-get install -y shellcheck && shellcheck -S error $(git ls-files '*.sh') install.sh update.sh get.sh sysmode/sysmode scripts/halcyon-tune

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every Python file compiles
        run: python3 -m compileall -q scripts quickshell/island/scripts

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: qmllint the island (catches "X is not a type" before you hit it at login)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          qmllint6 -I quickshell/island quickshell/island/*.qml 2>&1 | grep -iE "is not a type|unqualified|syntax" | head -50 || true

  install-smoke:
    # install.sh --dry-run on a clean Arch and a clean Debian: catches syntax slips, bad flags and steps that die before they start.
    # It changes nothing in the container. continue-on-error for now: if a container quirk (no systemd, no TTY) trips it, it is a
    # signal to read, not a blocked push; remove that line once it has been green for a while.
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, debian:trixie]
    container: ${{ matrix.image }}
    steps:
      - name: tools the checkout and the installer need
        run: |
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm git sudo curl; else apt-get update && apt-get install -y git sudo curl ca-certificates; fi
      - uses: actions/checkout@v4
      - name: a normal user to install for
        run: useradd -m tester
      - name: install.sh --dry-run
        run: bash install.sh --dry-run --yes --user tester --no-packages --no-drivers
      - name: install.sh --help still works
        run: bash install.sh --help | head -n 5
