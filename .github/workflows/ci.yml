name: ci
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libraries some crates need (evdev)
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: 'Cargo.lock matches the crates (warning only; if it fires, run cargo build locally and commit the lock)'
        continue-on-error: true
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: build every helper (one workspace, one target directory)
        run: cargo build --workspace --release
      - name: test
        run: cargo test --workspace
      - name: clippy (no unwrap(), every unsafe block has a SAFETY comment; other lints are reported, not blocking)
        run: cargo clippy --workspace -- -D clippy::unwrap_used -D clippy::undocumented_unsafe_blocks

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: syntax check every shell script
        run: |
          fail=0
          for f in $(git ls-files '*.sh') install.sh update.sh get.sh sysmode/sysmode scripts/halcyon-tune; do
            bash -n "$f" || fail=1
          done
          exit $fail
      - name: counter-scan rules (ON only in stealth, OFF always, saved choice survives a mode change)
        run: bash tests/counterscan.sh
      - name: special workspaces (special.sh starts the app only when its workspace is empty and it is not running elsewhere; jq and plain-text paths)
        run: sudo apt-get install -y jq && bash tests/special.test.sh
      - name: settings export / import (round trip, import preview new / changed / same, hostile archives refused)
        run: bash tests/settings-io.test.sh
      - name: "game launcher (hgl: library, checksum-verified Proton install, scoped run, gaming-mode restore even when hgl is killed, Steam import, triage; system programs are fakes)"
        run: cargo build --release -p hgl && HGL=target/release/hgl bash tests/hgl.test.sh
      - name: commands and widgets (halcyon CLI lists line up, every IPC call and launcher entry exists, every widget type has its file)
        run: node tests/commands-widgets.test.js
      - name: lock screen widget rules (which widgets may be on the lock screen, the two lists stay apart, feeds merge)
        run: node tests/widgetdata-lock.test.js
      - name: settings groups (every group on exactly one page, known sections, section order)
        run: node tests/settings-groups.test.js
      - name: "Settings drop-down rows and wake-spot insets"
        run: node tests/settings-drop.test.js
      - name: Bar builder data (shape, side, capsules, old layouts still load)
        run: node tests/bar-layout.test.js
      - name: QML types and double bindings (what qmllint cannot see without Quickshell's types; both stop the island at login)
        run: node tests/qml-types.test.js
      - name: security center Ask gate (only security questions and /test reach ai-firewall / ai-antivirus)
        run: node tests/secask.test.js
      - name: shellcheck (errors only, so old scripts do not block a push)
        run: sudo apt-get install -y shellcheck && shellcheck -S error $(git ls-files '*.sh') install.sh update.sh get.sh sysmode/sysmode scripts/halcyon-tune

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every Python file compiles
        run: python3 -m compileall -q scripts quickshell/island/scripts
      - name: task detection (reminder cues, times like tonight at 11 / at 9, several times in one note)
        run: python3 tests/test_task_detect.py
      - name: birthday import (date formats, invalid days like 02-30 are rejected, vCard and CSV)
        run: python3 tests/test_birthdays.py
      - name: "Notes tasks in the calendar (only tasks with a time, first line is the title, ticked ones are done)"
        run: python3 tests/test_note_tasks_calendar.py
      - name: everyday tools (colour formats, Wi-Fi QR text, mixer, VPN, updates, snippets, windows, phone, zoom; system programs are stubs)
        run: python3 tests/test_tools.py
      - name: safety check review (rkhunter / AIDE / Lynis noise rules, the verdicts, never "all good" from the model)
        run: python3 tests/test_safety_review.py
      - name: weekly sky (the week's stars from Focus, tasks and calendar)
        run: python3 tests/test_weekly_sky.py
      - name: no script defines the same top-level constant or function twice (two RULES tables once broke >do)
        run: python3 tests/test_no_redefine.py
      - name: '>ask routing (small talk gets a fixed reply, general questions are not turned into Halcyon guides; model stubbed)'
        run: python3 tests/test_ask_routing.py
      - name: ClamAV test and scan (fixes only from the fixed list, the model only orders them, home folders only; clamscan stubbed)
        run: python3 tests/test_clamav.py
      - name: model eval scoring (two fake models; no Ollama)
        run: python3 tests/test_ai_eval.py
      - name: Luna window sessions (fake `luna --stdio`; sessions saved, resumed, deleted; gaming mode and a missing Luna stop it)
        run: python3 tests/test_luna_bridge.py
      - name: Luna's Halcyon tools (tiers enforced, arguments validated, the admin password never on a command line; every program stubbed)
        run: python3 tests/test_halcyon_control.py
      - name: cache trimmer (only Halcyon's own caches, oldest first, never while a build runs)
        run: python3 tests/test_cache_trim.py
      - name: Study Center chats (one per material, files added together share one, each reads only its own files, old conversation migrated)
        run: python3 tests/test_study_chats.py
      - name: "Wi-Fi connect steps (fake nmcli: every step reported, failures explained, password never logged, saved profiles never deleted)"
        run: bash tests/wifi-connect.test.sh
      - name: "Login screen launch (greetd splits arguments at spaces: only plain words may be passed, the wrapper logs and keeps the exit code)"
        run: bash tests/greeter-launch.test.sh

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'qmllint the island (fails on "X is not a type", unresolved imports and syntax errors, the ones that break the shell at login)'
        run: |
          sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools
          # --max-warnings is not used: unqualified-access style warnings stay informational, only the breaking classes fail the job
          qmllint6 -I quickshell/island quickshell/island/*.qml > qmllint.txt 2>&1 || true
          cat qmllint.txt
          if grep -iE "is not a type|failed to import|could not resolve|syntax error|unexpected token|expected token" qmllint.txt; then
            echo "::error::qmllint found an error that would break the shell on startup (listed above)"
            exit 1
          fi

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 'every Hyprland Lua file parses (a typo here leaves you with a broken session on reload)'
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.4
          fail=0
          for f in hyprland.lua hypr-user.lua variables.lua hyprland/*.lua scheme/*.lua; do
            [ -f "$f" ] || continue
            luac5.4 -p "$f" || fail=1
          done
          exit $fail

  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: systemd-analyze verify the units in systemd/
        run: |
          fail=0
          for f in systemd/*.service systemd/*.timer systemd/*.target; do
            [ -f "$f" ] || continue
            # the units are installed with their full path in ExecStart; a missing binary on the runner is not a unit mistake
            out=$(systemd-analyze verify "$f" 2>&1 | grep -v "Command .* is not executable\|No such file or directory\|Failed to create .*/dev" || true)
            [ -n "$out" ] && { echo "== $f"; echo "$out"; fail=1; }
          done
          exit $fail

  install-smoke:
    # install.sh --dry-run on a clean Arch and a clean Debian: catches syntax slips, bad flags and steps that die before they start.
    # It changes nothing in the container. Blocking since it stayed green on both images for every run up to v10.2.0.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [archlinux:latest, debian:trixie, fedora:44]
    container: ${{ matrix.image }}
    steps:
      - name: tools the checkout and the installer need
        run: |
          if command -v pacman >/dev/null; then pacman -Sy --noconfirm git sudo curl; elif command -v dnf >/dev/null; then dnf install -y git sudo curl; else apt-get update && apt-get install -y git sudo curl ca-certificates; fi
      - uses: actions/checkout@v4
      - name: a normal user to install for
        run: useradd -m tester
      - name: install.sh --dry-run
        run: bash install.sh --dry-run --yes --user tester --no-packages --no-drivers
      - name: install.sh --help still works
        run: bash install.sh --help | head -n 5
